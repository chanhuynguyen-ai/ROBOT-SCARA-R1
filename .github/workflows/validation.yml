name: Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Check reference integrity and trajectory
        run: python -B scripts/project.py --mode verify
      - name: Check geometry regressions
        run: python -B -m unittest discover -s simulation/p7/tests -v
      - name: Check native MuJoCo replay
        run: python -B scripts/project.py --mode native
